[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-smart-logger-docker"
version = "1.0.17"
description = "Huawei Smart Logger MQTT worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pydantic-settings>=2.3,<3",
    "requests>=2.32,<3",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"